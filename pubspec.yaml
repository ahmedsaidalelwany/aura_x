name: aura_x
description: "Aura-X — offline-first adaptive file management application"
publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.13.1



dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Platform/UI foundation
  cupertino_icons: ^1.0.9
  google_fonts: ^8.2.1
  adaptive_platform_ui: ^0.1.111
  responsive_framework: ^1.5.1
  flutter_animate: ^4.5.2
  animations: ^3.0.0
  rive: ^0.14.11
  skeletonizer: ^2.1.3
  flutter_screenutil: ^5.9.3


  # Application architecture / navigation / state
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  injectable: ^3.0.0
  go_router: ^18.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Localization / formatting
  intl: ^0.20.3
  localization: ^2.1.1

  # Local persistence / preferences
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5

  # File system / file selection / file metadata / sharing
  uuid: ^4.6.0
  file_picker: ^12.2.0
  mime: ^2.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  share_plus: ^13.3.0

  # .aur container / archive processing
  archive: ^4.2.0

  # Integrity, fingerprints and cryptographic security
  crypto: ^3.0.7
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  flutter_secure_storage: ^11.1.0

  # File viewers / document handling
  syncfusion_flutter_pdfviewer: ^34.2.7
  syncfusion_flutter_pdf: ^34.2.7
  flutter_html: ^3.0.0

  # Optional multi-format native document adapter.
  # Keep behind the viewer registry; it is not the core viewer architecture.
  universal_dockit: ^1.0.1

  # Optional online/cloud capability
  connectivity_plus: ^7.3.1
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.3
  extension_google_sign_in_as_googleapis_auth: ^3.0.0

  # UX / platform capabilities
  permission_handler: ^13.0.2
  toastification: ^3.2.0
  vibration: ^3.2.1

# ============================================================
# DEVELOPMENT / CODE GENERATION / TESTING
# ============================================================

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Static analysis
  flutter_lints: ^6.0.0

  # Dependency injection / model generation
  build_runner: ^2.16.1
  injectable_generator: ^3.1.3
  freezed: ^4.0.1
  json_serializable: ^6.14.1

  # BLoC and unit testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
